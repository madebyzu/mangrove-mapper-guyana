  # Planet NICFI basemaps for the labelling widget (run_interpretation_widget).
  # Planet's licence forbids sharing them, so this asset is private: upload your
  # own basemaps to your GEE project and replace this path, or pass collection_path.
  collection_path: projects/irp-zu/assets/basemaps-guyana

default_date_range:
  # Training year 2020
  start_date: '2020-01-01'
  end_date: '2020-12-31'

target:
  # dataset_id: ESA/WorldCover/v100
  dataset_id: projects/sat-io/open-datasets/GMW/annual-extent/GMW_MNG_2020 # Global Mangrove Watch (GMW) 2020 10m
  # mangrove_class: 95 # WorldCover Mangrove Class
  mangrove_class : 1 # GMW Mangrove Class
  permanent_water_threshold: 100

export:
  num_sample_points: 6000 # the upper bound of samples per class
  target_name: label
  scale: 10
  seed: 48
  tile_scale: 4
  geometries: true


preprocessing:
  sentinel1:
    edge_mask_threshold_db: -40  # pixels below this threshold (dB) are treated as edge artifacts
    speckle_filter: true  # applies Refined Lee filter; disable for faster visualisation
  alos_palsar:
    speckle_filter: true

bands:
  # references: National Aeronautics and Space Administration (NASA)
  # docs/references.md#documentation
  landsat8:
    - SR_B2 
    - SR_B3
    - SR_B4
    - SR_B5
    - SR_B6
    - SR_B7

  sentinel1:
    - VV_asc
    - VH_asc
    - VV_desc
    - VH_desc
    - mRFDI

  # references: European Space Agency (ESA)
  # docs/references.md#documentation
  sentinel2:
    - B2
    - B3
    - B4
    - B5
    - B6
    - B7
    - B8
    - B8A
    - B11
    - B12

  alos_palsar:
    - HH
    - HV
    - mRFDI
    - HV_ratio

risk:
  geometry:
    # Coastline contours appear like a pixel staircase so gradients are unstable and the 
    # shoreline normals point in wild directions. As a result, a Box Filter smoothing window 
    # is applied where width is the number vertices.
    # Given 10 m pixel spacing, 25 is ≈ 250 m of smoothing. Too low, normals are noisy; too high, 
    smooth_win: 270

    # Alongshore spacing of transect origins. Original idea from Best et al. (2022).
    spacing_m: 100

    # Sampling step along each transect. Matched to the 10 m pixel: finer just
    # re-reads the same pixels, coarser can step over a thin belt entirely.
    step_m: 10

    # How far landward a transect looks for the mangrove belt. Must exceed the
    # widest belt.
    # NOTE: May need to tune to the particular region.
    max_len_m: 4000

    # Consecutive misses tolerated inside one belt, in steps (2 = 20 m). Stops a
    # single-pixel classification dropout from splitting one continuous fringe
    # into two.
    gap_tol: 2

    # The seaward look distance from the coastline to the sea at the direction normal to the coast.
    rmax_m: 3000

    # Minimum seaward open water in metres for a transect to count as open-coast.
    fetch_min_m: 1500

  index:
    # Derived from Best et al., 2022
    alpha_fringe: 0.0026 # mangrove belt (midpoint of the Chateau Margot range)
    alpha_fr_lo: 0.0020  # sensitivity band low (Chateau Margot Region 4)
    alpha_fr_lit: 0.00578 # steepest literature value ("50% at 120 m")

    exposure_depth_m: 4000 # population and landcover will be sampled up to 4km inland of the mangrove belt
    exposure_classes: # DynamicWorld: 4 = crops, 6 = built 
    # docs/references.md#documentation : Dynamic World V1
      - 4 
      - 6

    # 25 ppl/ha was selected as the density by which exposure risk is saturated. The max number I saw was 98 ppl/ha
    # but most regions have very few or no people, so 25 seemed like a reasonable cutoff (representing a village or small town).
    pop_full_exposure_per_ha: 25

    belt_weights:
      fringe: 0.50
      evi: 0.25
      hv: 0.25

    leg_weights:
      belt: 1
      exposure: 1
      erosion: 1

    exposure_min_multiplier: 0.25
    erosion_min_multiplier: 0.25
    
